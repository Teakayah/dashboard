name: CI + deploy integration → main

on:
  pull_request:
    branches: [main]

jobs:
  # ── Integrate + Test + Deploy ──────────────────────────────────────────────
  integrate:
    name: Test and Merge integration → main
    if: github.event.pull_request.head.ref == 'integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Setup & Tests
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Generated HTML pages live on main only (CLAUDE.md §3). The PR merge ref
      # propagates integration's deletion of those files, leaving the worktree
      # without them — rebuild_analyses.py would then SKIP and Playwright tests
      # would 404. Hydrate from origin/main so the rebuild + test steps work.
      - name: Hydrate generated pages from main
        run: |
          git fetch origin main --depth=1
          for f in index.html feed.xml descriptions.json favicon.ico \
                   employment_rate_canada.html nhpi_big6_comparison.html \
                   flood_risk_gatineau_ottawa.html; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git show "origin/main:$f" > "$f"
              echo "  hydrated $f"
            else
              echo "  skip $f (not on main)"
            fi
          done

      - name: Generate index.html + inject og tags
        run: python3 deployment/generate_index.py

      - name: Fetch and Rebuild flood data
        run: |
          mkdir -p source
          python3 deployment/update_flood_data.py
          python3 deployment/rebuild_analyses.py || [ $? -eq 1 ]

      - name: Run usability tests
        run: pytest tests/ -v --tb=short

      # 2. Merge integration into main
      - name: Merge integration into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The pre-merge generate/rebuild steps dirty generated .html files
          # (dropzone.html, employment_rate_canada.html, etc.) in the worktree.
          # These live on main only and are regenerated below after the merge,
          # so discard them here to let the branch switch succeed.
          git checkout -f main
          # Snapshot the pre-merge main SHA so we can restore generated files
          # that integration deletes (per CLAUDE.md §3, these live on main only).
          MAIN_SHA_PRE_MERGE=$(git rev-parse HEAD)
          if ! git merge origin/integration --no-ff -m "chore: auto-merge integration into main [skip ci]"; then
            echo "Merge conflict detected."
            
            # Identify conflicted files
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files: $CONFLICTS"
            
            # Check if any non-generated file is conflicted
            STRICT_CONFLICTS=$(echo "$CONFLICTS" | grep -vE '^(index\.html|feed\.xml|previews/|.*\.html|favicon\.ico|descriptions\.json)$' || true)
            
            if [ -n "$STRICT_CONFLICTS" ]; then
              echo "CRITICAL: Conflict in source/test files: $STRICT_CONFLICTS"
              exit 1
            else
              echo "Resolving conflicts in generated assets by taking 'integration' version where available."
              git checkout --theirs -- . || true
              # descriptions.json must be preserved from main if missing in integration
              git checkout --ours -- descriptions.json || true
              git add -A
              git commit --no-edit
            fi
          fi

          # Restore generated files that integration deleted, so the final-gen
          # step (rebuild_analyses.py refreshes data in *existing* files only)
          # has something to operate on and main keeps the deployed pages.
          RESTORED=0
          for f in index.html feed.xml descriptions.json favicon.ico \
                   employment_rate_canada.html nhpi_big6_comparison.html \
                   flood_risk_gatineau_ottawa.html; do
            if [ ! -f "$f" ] && git cat-file -e "$MAIN_SHA_PRE_MERGE:$f" 2>/dev/null; then
              git show "$MAIN_SHA_PRE_MERGE:$f" > "$f"
              git add "$f"
              RESTORED=1
              echo "  restored $f from pre-merge main"
            fi
          done
          if [ "$RESTORED" = "1" ]; then
            git commit -m "chore: restore generated artifacts dropped by integration merge [skip ci]"
          fi

      # 3. Update Previews & Push
      - name: Final asset generation
        run: |
          mkdir -p source
          python3 deployment/update_flood_data.py
          python3 deployment/rebuild_analyses.py || [ $? -eq 1 ]
          python3 deployment/generate_index.py
          python3 deployment/generate_feed.py
          python3 deployment/screenshot.py

      - name: Commit and push to main
        run: |
          git add index.html feed.xml previews/ *.html favicon.ico descriptions.json
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: update index, feed, previews, og tags [skip ci]"
          git push origin main

      # 4. Notify on failure
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Integration failed — ${context.sha.slice(0, 7)}`,
              body: `Workflow failed on PR #${context.payload.pull_request.number}. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
