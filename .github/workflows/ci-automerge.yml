name: CI + deploy integration → main

on:
  pull_request:
    branches: [main]

jobs:
  # ── Integrate + Test + Deploy ──────────────────────────────────────────────
  integrate:
    name: Test and Merge integration → main
    if: github.event.pull_request.head.ref == 'integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Setup & Tests
      - name: Install dependencies
        run: |
          pip install pytest pytest-playwright playwright
          python -m playwright install --with-deps chromium

      - name: Generate index.html + inject og tags
        run: python3 deployment/generate_index.py

      - name: Fetch and Rebuild flood data
        run: |
          mkdir -p source
          python3 deployment/update_flood_data.py
          python3 deployment/rebuild_analyses.py || [ $? -eq 1 ]

      - name: Run usability tests
        run: pytest tests/ -v --tb=short

      # 2. Merge integration into main
      - name: Merge integration into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The pre-merge generate/rebuild steps dirty generated .html files
          # (dropzone.html, employment_rate_canada.html, etc.) in the worktree.
          # These live on main only and are regenerated below after the merge,
          # so discard them here to let the branch switch succeed.
          git checkout -f main
          if ! git merge origin/integration --no-ff -m "chore: auto-merge integration into main [skip ci]"; then
            echo "Merge conflict detected."
            
            # Identify conflicted files
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files: $CONFLICTS"
            
            # Check if any non-generated file is conflicted
            STRICT_CONFLICTS=$(echo "$CONFLICTS" | grep -vE '^(index\.html|feed\.xml|previews/|.*\.html|favicon\.ico|descriptions\.json)$' || true)
            
            if [ -n "$STRICT_CONFLICTS" ]; then
              echo "CRITICAL: Conflict in source/test files: $STRICT_CONFLICTS"
              exit 1
            else
              echo "Resolving conflicts in generated assets by taking 'integration' version where available."
              git checkout --theirs -- . || true
              # descriptions.json must be preserved from main if missing in integration
              git checkout --ours -- descriptions.json || true
              git add -A
              git commit --no-edit
            fi
          fi

      # 3. Update Previews & Push
      - name: Final asset generation
        run: |
          mkdir -p source
          python3 deployment/update_flood_data.py
          python3 deployment/rebuild_analyses.py || [ $? -eq 1 ]
          python3 deployment/generate_index.py
          python3 deployment/generate_feed.py
          python3 deployment/screenshot.py

      - name: Commit and push to main
        run: |
          git add index.html feed.xml previews/ *.html favicon.ico descriptions.json
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: update index, feed, previews, og tags [skip ci]"
          git push origin main

      # 4. Notify on failure
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Integration failed — ${context.sha.slice(0, 7)}`,
              body: `Workflow failed on PR #${context.payload.pull_request.number}. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
