name: Deploy & Refresh Assets on main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Assets & Sync main → integration
    if: "!contains(github.event.head_commit.message, '[skip ci]') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright Chromium Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium with dependencies
        run: python -m playwright install --with-deps chromium

      - name: Rebuild analyses, index, feed, and previews
        run: |
          mkdir -p source
          python3 deployment/update_flood_data.py
          python3 deployment/rebuild_analyses.py || [ $? -eq 1 ]
          python3 deployment/generate_index.py
          python3 deployment/generate_feed.py
          python3 deployment/screenshot.py

      - name: Commit regenerated assets and sync integration
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml previews/ *.html favicon.ico
          [ -f descriptions.json ] && git add descriptions.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update index, feed, previews, og tags [skip ci]"
          fi
          git push origin HEAD:main
          git push origin HEAD:integration || echo "Warning: integration has new commits; skipping fast-forward sync."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed — ${context.sha.slice(0, 7)}`,
              body: `Deploy workflow failed on main (${context.sha}). [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
